<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Video Call</title>
    <style>
        body { font-family: sans-serif; background: #202124; color: white; text-align: center; padding: 20px; }
        .video-grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        video { width: 45%; max-width: 400px; background: #000; border-radius: 8px; transform: scaleX(-1); }
        .box { background: #303134; padding: 15px; border-radius: 8px; margin: 10px auto; max-width: 500px; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #1557b0; }
        textarea { width: 90%; height: 60px; margin: 10px 0; background: #202124; color: #fff; border: 1px solid #5f6368; border-radius: 4px; padding: 5px; }
    </style>
</head>
<body>

<h1>1v1 Serverless Video Chat</h1>

<div class="video-grid">
    <div><p>You</p><video id="localVideo" autoplay playsinline muted></video></div>
    <div><p>Friend</p><video id="remoteVideo" autoplay playsinline></video></div>
</div>

<!-- STEP 1: Host starts the call -->
<div class="box">
    <h3>Step 1: Start a Call (Host Only)</h3>
    <button id="startBtn">Create Invite Link</button>
    <p>Send this short link to your friend:</p>
    <textarea aria-label="Invite Link" id="inviteLinkBox" readonly placeholder="Link will appear here..."></textarea>
</div>

<!-- STEP 2: Friend joins -->
<div class="box">
    <h3>Step 2: Join a Call (Friend Only)</h3>
    <p>If you clicked a link, click this button to generate your reply:</p>
    <button id="joinBtn">Generate Reply Code</button>
    <textarea aria-label="Reply Code" id="replyCodeBox" readonly placeholder="Reply code will appear here..."></textarea>
</div>

<!-- STEP 3: Host finishes connection -->
<div class="box">
    <h3>Step 3: Connect (Host Only)</h3>
    <p>Paste your friend's reply code here to start the call:</p>
    <textarea aria-label="Paste Reply Code" id="pasteReplyBox" placeholder="Paste reply code here..."></textarea>
    <button id="connectBtn">Connect Video</button>
</div>

<script>
    // Use free public Google server to help find network addresses
    const config = { iceServers: [{ urls: 'stun:google.com' }] };
    let pc = new RTCPeerConnection(config);
    let localStream;

    // Compression helpers (Gzip + Base64)
    async function shrink(text) {
        const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
        const buffer = await new Response(stream).arrayBuffer();
        return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function grow(base64) {
        let b64 = base64.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const binary = atob(b64);
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
    }

    // Get camera and microphone access
    async function init() {
        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    // Show your friend's video when it arrives
    pc.ontrack = event => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
    };

    // HOST ACTION: Create the call link
    document.getElementById('startBtn').onclick = async () => {
        await init();

        // Wait for network addresses to gather
        pc.onicecandidate = async (e) => {
            console.log("line 90");
            document.getElementById('inviteLinkBox').value = `Generating link...`;
            if (!e.candidate) { // Gathering finished
                const compressed = await shrink(JSON.stringify(pc.localDescription));
                const currentUrl = window.location.href.split('#')[0];
                document.getElementById('inviteLinkBox').value = `${currentUrl}#${compressed}`;
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
    };

    // FRIEND ACTION: Create the reply code
    document.getElementById('joinBtn').onclick = async () => {
        const hash = window.location.hash.substring(1);
        if (!hash) return alert("No invite code found in the URL link!");

        await init();
        const offerDesc = JSON.parse(await grow(hash));
        await pc.setRemoteDescription(new RTCSessionDescription(offerDesc));

        pc.onicecandidate = async (e) => {
            if (!e.candidate) {
                document.getElementById('replyCodeBox').value = await shrink(JSON.stringify(pc.localDescription));
            }
        };

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
    };

    // HOST ACTION: Final connection step
    document.getElementById('connectBtn').onclick = async () => {
        const replyText = document.getElementById('pasteReplyBox').value.trim();
        if (!replyText) return alert("Please paste the reply code first.");

        const answerDesc = JSON.parse(await grow(replyText));
        await pc.setRemoteDescription(new RTCSessionDescription(answerDesc));
    };
</script>
</body>
</html>
